name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Microsoft's Playwright image for the locked version ships Chromium, WebKit and their system libraries, so CI never
    # installs packages from the Ubuntu mirror (which stalled or crawled at about 40 kB/s three times). Keep the tag equal
    # to @playwright/test in package.json; the first browser step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: World data check
        run: npm run world:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Size budgets
        timeout-minutes: 2
        run: npm run budget
      - name: Balance runs
        # About 100 seconds locally; each batch of events is rolled back as a unit if it fails, which costs copies.
        timeout-minutes: 10
        run: npm run balance
      - name: The container's Playwright matches the lockfile
        run: |
          locked=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$locked" = "1.63.0" || { echo "package.json locks Playwright $locked; update the container image tag in ci.yml to match."; exit 1; }
      - name: Browser journeys
        timeout-minutes: 20
        env:
          HOME: /root
        run: npm run e2e -- --trace retain-on-failure
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
