name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Microsoft's Playwright image for the locked version ships Chromium, WebKit and their system libraries, so CI never
    # installs packages from the Ubuntu mirror (which stalled or crawled at about 40 kB/s three times). Keep the tag equal
    # to @playwright/test in package.json; the first browser step checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # The checks that need no browser. Until November 12, 2026 this job also ran the whole browser suite twice, one
    # after the other (dev server, then production build), each step with its own limit: 20 minutes, then 30, 45 and
    # 60 as the suite grew, and the job 75, 110 and 140. On that day the dev run was cut at 60 minutes at journey 395
    # of about 400 with none failed (PR #70). The journeys are their own job now, six runs side by side, so no limit
    # had to grow again and a pull request waits for the slowest of them, not the sum.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: World data check
        run: npm run world:check
      - name: Awards catalog matches its rosters
        run: python3 tools/awards/build.py --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Size budgets
        timeout-minutes: 2
        run: npm run budget
      - name: Balance runs
        # About 100 seconds locally; each batch of events is rolled back as a unit if it fails, which costs copies.
        timeout-minutes: 10
        run: npm run balance
      - name: The container's Playwright matches the lockfile
        run: |
          locked=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          test "$locked" = "1.63.0" || { echo "package.json locks Playwright $locked; update the container image tag in ci.yml to match."; exit 1; }

  journeys:
    name: journeys (${{ matrix.build }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # The whole browser suite, split by build (the dev server; the production build served by server/serve.mjs, which
    # playwright.config.ts builds when SLATE_E2E_PROD is 1) and by profile (playwright.config.ts projects). Each run is
    # one worker. The slowest, desktop, took about 24 minutes locally on November 12, 2026.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        build: [dev, production]
        profile: [desktop, phone, webkit]
        include:
          - profile: desktop
            projects: --project=desktop
          - profile: phone
            projects: --project=phone
          - profile: webkit
            projects: --project=iphone-15-plus --project=iphone-15-pro-max --project=iphone-15-pro-max-landscape
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser journeys
        timeout-minutes: 60
        env:
          HOME: /root
          SLATE_E2E_PROD: ${{ matrix.build == 'production' && '1' || '' }}
        run: npm run e2e -- ${{ matrix.projects }} --trace retain-on-failure
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.build }}-${{ matrix.profile }}
          path: test-results/
          retention-days: 14
