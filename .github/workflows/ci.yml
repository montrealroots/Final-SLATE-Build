name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: World data check
        run: npm run world:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers matching the lockfile
        run: npx playwright install --with-deps chromium webkit
      - name: Browser journeys
        run: npm run e2e -- --trace retain-on-failure
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
