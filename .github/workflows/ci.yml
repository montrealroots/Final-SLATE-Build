name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: World data check
        run: npm run world:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Size budgets
        timeout-minutes: 2
        run: npm run budget
      - name: Balance runs
        # About 100 seconds locally; each batch of events is rolled back as a unit if it fails, which costs copies.
        timeout-minutes: 10
        run: npm run balance
      - name: Read the locked Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers matching the lockfile
        # The Ubuntu package mirror has stalled this step twice (once over 40 minutes). Each attempt is bounded and
        # retried once; the browsers themselves come from the cache when the locked version hasn't changed.
        timeout-minutes: 20
        run: |
          for attempt in 1 2; do
            timeout 540 npx playwright install --with-deps chromium webkit && exit 0
            echo "Install attempt $attempt did not finish; retrying."
            sleep 15
          done
          exit 1
      - name: Browser journeys
        timeout-minutes: 20
        run: npm run e2e -- --trace retain-on-failure
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14
